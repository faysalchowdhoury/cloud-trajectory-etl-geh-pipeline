[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cloud-trajectory-etl-geh-pipeline"
version = "1.0.0"
description = "NGSIM trajectory ETL on PySpark, lane-level HMM map matching, RTS smoothing, Optuna CTM calibration with FHWA GEH, drift monitoring."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["numpy>=1.26", "pandas>=2.2", "scipy>=1.12", "pyarrow>=15", "pyspark>=3.5,<4", "optuna>=3.6",
                "pydantic>=2.6,<3", "matplotlib>=3.8"]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "httpx>=0.27"]
dev = ["pytest>=8.0"]

[project.scripts]
trajetl = "trajetl.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
